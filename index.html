*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"DejaVu Sans","Segoe UI",Arial,sans-serif;background:#b5e4f3 var(--meadow) center/cover fixed no-repeat;min-height:100vh;min-height:100svh}
[hidden]{display:none!important}
button,input{font:inherit}
button,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:var(--ink)}
:focus-visible,input:focus-visible+label{outline:4px solid #8d4f00;outline-offset:4px}
.shell{width:min(1280px,100%);min-height:100svh;padding:clamp(14px,2.2vw,34px) clamp(16px,4vw,62px);margin:auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand,.sound{display:flex;align-items:center;gap:10px;font-size:clamp(14px,1.4vw,19px);font-weight:750}
.brand img{width:34px;height:34px;object-fit:contain}
.sound{background:#fffdf5ec;border:1px solid #fff;border-radius:30px;min-height:44px;padding:8px 16px;box-shadow:0 3px 0 #56758539}
.sound svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}
.sound[aria-pressed=true] .mute,.sound[aria-pressed=false] .waves{display:none}
main{flex:1;display:grid;align-items:center}
.home,.finish{position:relative;isolation:isolate;width:100%;display:grid;align-items:center;grid-template-columns:1.08fr 1fr;gap:4%;padding:24px 0 clamp(32px,8vh,95px)}
h1,h2,p{margin:0}
h1,.finish h2{font-size:clamp(44px,6.35vw,94px);letter-spacing:-.058em;font-weight:850;line-height:1.01}
h1 span{display:block}
.intro{font-size:clamp(17px,1.7vw,23px);line-height:1.45;margin:16px 0 24px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:750;font-size:16px;margin-bottom:10px}
.modes{display:flex;gap:12px}
.modes input{position:absolute;opacity:0;width:1px;height:1px}
.modes label{display:flex;align-items:center;gap:9px;position:relative;background:#fffcf2dd;border:2px solid #ffffffd9;border-radius:18px;padding:11px 14px;min-height:66px;font-weight:720;cursor:pointer;box-shadow:0 3px 0 #446d8630;font-size:clamp(14px,1.25vw,18px)}
.modes label b{font-size:1.6em;line-height:1}
.modes input:checked+label{border-color:#214f88;background:#edf7ff;box-shadow:0 3px 0 #214f88}
.modes label i{width:17px;height:17px;border:1.7px solid #8194a7;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px}
.modes input:checked+label i{border-color:var(--blue);background:var(--blue);color:white}
.modes input:checked+label i:after{content:"✓"}
.cta{border:2px solid #864c18;background:var(--orange);border-radius:18px;box-shadow:0 4px 0 #955d25;padding:12px 24px;font-weight:800;min-height:52px;font-size:clamp(17px,1.7vw,24px)}
.cta:active{background:#ffb348}
#start,.again{margin-top:24px}
.portrait{position:relative;display:grid;place-items:center;min-width:0;pointer-events:none}
.portrait>img{width:112%;display:block;filter:drop-shadow(0 13px 12px #45749727)}
.game{width:min(890px,100%);margin:12px auto 24px}
.game-head{display:flex;align-items:center;justify-content:space-between;font-weight:780;font-size:clamp(16px,1.7vw,23px)}
.score{display:flex;align-items:center;gap:7px;background:#fff9e9;padding:6px 14px;border-radius:30px}
.score img{width:30px;height:30px;object-fit:contain}
progress{appearance:none;height:8px;width:100%;border:0;overflow:hidden;border-radius:20px;background:#edf8ffc9;margin:9px 0 12px}
progress::-webkit-progress-bar{background:#edf8ffc9;border-radius:20px}
progress::-webkit-progress-value{background:var(--blue);border-radius:20px}
progress::-moz-progress-bar{background:var(--blue);border-radius:20px}
.target{display:flex;justify-content:center;align-items:center;gap:.32em;font-weight:800;background:#fffdf5ed;border:2px solid white;border-radius:26px;padding:8px;min-height:clamp(70px,13vh,122px);font-size:clamp(23px,3.3vw,50px);letter-spacing:-.035em}
.target b{background:#ffe1a3;padding:0 .2em .04em;border-radius:.25em;color:var(--ink);font-size:1.5em;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.9vh,18px);margin:clamp(12px,2vh,20px) 0}
.tile{background:var(--paper);border:2px solid white;border-radius:clamp(16px,2vw,26px);box-shadow:0 5px 0 #789eae,0 9px 17px #2846661a;height:clamp(76px,15vh,154px);font-size:clamp(46px,min(8.5vw,11vh),105px);font-weight:760;line-height:1;color:var(--ink);opacity:1}
.tile:disabled{cursor:default;color:var(--ink)}
.tile.wrong{border:3px solid #a65b28;background:#ffedd9}
.tile.correct{border:3px solid #a66e00;background:#ffde87;box-shadow:0 5px 0 #b48432,0 0 22px #fff3a9}
.response{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px}
.feedback{display:flex;align-items:center;gap:9px;font-weight:800;font-size:clamp(16px,2vw,26px);border-radius:18px}
.feedback:not(:empty){background:#fffdf2eb;padding:8px 14px}
.feedback img{width:35px;height:35px;object-fit:contain;animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
.finish h2{font-size:clamp(42px,5.2vw,75px)}
.finish p{font-size:clamp(22px,2.2vw,32px);line-height:1.3;margin:14px 0}
.stars{width:min(330px,100%);display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:15px 0}
.stars img{width:100%;aspect-ratio:1;object-fit:contain}
@media(max-width:720px) and (orientation:portrait){
 .brand{gap:6px}.brand img{width:27px;height:27px}.sound{padding:6px 10px;font-size:13px}
 .home,.finish{display:flex;flex-direction:column-reverse;gap:6px;align-items:center;text-align:center;padding:12px 0 32px}
 .portrait{width:min(64vw,29vh)}.portrait>img{width:100%}
 h1 span{display:inline}h1{font-size:clamp(39px,9.4vw,60px)}.intro{margin:12px 0 20px}
 .modes{justify-content:center;gap:8px}.modes label{padding:9px 10px;min-height:54px;gap:6px}
 legend{margin-inline:auto}.stars{margin-inline:auto}.game{margin-block:16px}.target{font-size:clamp(21px,5.6vw,33px)}
 .tile{height:clamp(86px,14vh,128px);font-size:clamp(46px,12vw,78px)}.response{flex-direction:column;justify-content:flex-start;min-height:110px;gap:5px}
}
@media(max-height:540px) and (orientation:landscape){
 .shell{padding-block:7px}.sound{min-height:38px}.home,.finish{padding:6px 0 12px;gap:2%}h1,.finish h2{font-size:clamp(36px,5.6vw,60px)}
 .intro{margin:7px 0 10px;font-size:16px}.modes label{min-height:44px;padding:7px 10px}#start,.again{margin-top:10px}
 .portrait{max-height:57vh}.portrait>img{max-height:57vh;object-fit:contain}.game{margin:4px auto;width:min(730px,100%)}.game-head{font-size:15px}.score{padding:2px 9px}.score img{width:19px;height:19px}
 progress{height:5px;margin:3px 0}.target{min-height:44px;font-size:23px;padding:4px}.grid{margin:8px 0;gap:8px}.tile{height:clamp(44px,14vh,75px);font-size:clamp(34px,10vh,54px)}
 .response{min-height:45px}.cta{min-height:41px;padding:7px 16px;font-size:16px}.feedback:not(:empty){padding:4px 10px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>

   const oscillator=audio.createOscillator(), gain=audio.createGain(), t=audio.currentTime+i*.11;
   oscillator.type='sine';oscillator.frequency.value=hz;
   gain.gain.setValueAtTime(.001,t);gain.gain.exponentialRampToValueAtTime(.095,t+.02);
   gain.gain.exponentialRampToValueAtTime(.001,t+.17);
   oscillator.connect(gain);gain.connect(audio.destination);oscillator.start(t);oscillator.stop(t+.18);
  });
 }catch{/* The visual feedback also works on devices without audio. */}
}
$('sound').onclick=()=>{
 soundOn=!soundOn;
 $('sound').setAttribute('aria-pressed',String(soundOn));
 $('soundText').textContent=soundOn?'Дыбыс қосулы':'Дыбыс өшірулі';
 if(soundOn)tone([523]);
};
function updateScore(){
 $('score').textContent=points+' / '+alphabet.length;
 $('progress').value=points;
}
function reset(){
 round=0;points=0;solved=false;lastPosition=-1;
 $('stars').replaceChildren();$('message').replaceChildren();updateScore();
}
function drawRound(){
 solved=false;
 const target=letters[round];
 const choices=shuffle(letters.filter(letter=>letter!==target)).slice(0,5);
 const positions=Array.from({length:6},(_,i)=>i).filter(i=>i!==lastPosition);
 lastPosition=positions[Math.floor(Math.random()*positions.length)];
 choices.splice(lastPosition,0,target);
 $('target').textContent=target;
 $('round').textContent=(round+1)+' / '+letters.length+' кезең';
 $('message').replaceChildren();$('next').hidden=true;
 $('board').replaceChildren(...choices.map(letter=>{
  const tile=document.createElement('button');
  tile.className='tile';tile.textContent=letter;
  tile.onclick=()=>answer(tile,letter);
  return tile;
 }));
 updateScore();$('instruction').focus({preventScroll:true});
}
function starImage(){
 const img=new Image();img.src=art.star;img.alt='';return img;
}
function answer(tile,letter){
 if(solved)return;
 for(const other of $('board').children)other.classList.remove('wrong');
 if(letter!==letters[round]){
  tile.classList.add('wrong');$('message').textContent='Тағы байқап көр!';tone([294]);return;
 }
 solved=true;points++;tile.classList.add('correct');
 for(const other of $('board').children)other.disabled=true;
 updateScore();$('message').replaceChildren(starImage(),'Жарайсың!');tone([523,659,784]);
 $('next').textContent=round+1===letters.length?'Нәтижені көру →':'Келесі әріп →';
 $('next').hidden=false;$('next').focus({preventScroll:true});
}
$('start').onclick=()=>{
 reset();const isUpper=$('upper').checked;
 letters=isUpper?[...alphabet]:alphabet.map(letter=>letter.toLowerCase());
 $('caseWord').textContent=isUpper?'Бас':'Кіші';
 screen('game');drawRound();
};
$('next').onclick=()=>{
 if(!solved||$('game').hidden)return;
 if(round+1===letters.length){
  $('stars').replaceChildren(...Array.from({length:points},starImage));
  screen('finish');tone([523,659,784,1047]);$('finishTitle').focus({preventScroll:true});
 }else{round++;drawRound();}
};
$('replay').onclick=()=>{reset();screen('home');$('start').focus({preventScroll:true});};
</script>
</body></html>
